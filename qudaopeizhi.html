<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP底部菜单配置</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 SortableJS 拖拽库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 15px; 
            margin: 0;
        }

        .container {
            background: #ffffff;
            width: 800px; 
            max-width: 100%;
            border: none;
        }

        /* 头部区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .header h2 {
            font-size: 20px;
            color: #2c3e50;
        }

        /* 按钮组通用样式 */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #2980b9; }

        .btn-success { background-color: #2ecc71; color: white; }
        .btn-success:hover:not(:disabled) { background-color: #27ae60; }

        .btn-default { background-color: #f1f3f5; color: #495057; }
        .btn-default:hover:not(:disabled) { background-color: #e2e6ea; }

        /* 列表容器 */
        .menu-list {
            list-style: none;
        }

        /* 列表项 */
        .menu-item {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: box-shadow 0.2s;
        }

        .menu-item.sortable-ghost {
            opacity: 0.4;
            background-color: #f0f0f0;
        }

        .drag-handle {
            cursor: grab;
            color: #95a5a6;
            font-size: 20px;
            padding: 0 15px;
            transition: opacity 0.3s;
        }
        
        .drag-handle:active {
            cursor: grabbing;
        }

        /* 图标上传区 */
        .icon-upload-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            border: 1px dashed #ccc;
            border-radius: 8px;
            margin-right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.3s;
        }

        .icon-upload-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .icon-upload-wrapper .placeholder {
            font-size: 12px;
            color: #999;
            text-align: center;
            line-height: 1.2;
        }

        .icon-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            left: 0;
            top: 0;
        }

        /* 表单输入区 */
        .form-group {
            display: flex;
            gap: 20px;
            flex: 1;
            align-items: center;
        }

        .form-group .field {
            display: flex;
            flex-direction: column;
            flex: 1; 
        }
        
        .form-group .field label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            width: 100%;
            background-color: #fff;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #3498db;
        }

        /* 操作区 */
        .actions {
            width: 60px;
            display: flex;
            justify-content: flex-end;
            padding-left: 15px;
            flex-shrink: 0;
            transition: opacity 0.3s;
        }

        .delete-btn {
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            transition: color 0.3s;
        }

        .delete-btn:hover:not(:disabled) {
            color: #c0392b;
        }
        
        .delete-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        /* ================= 浏览模式（View Mode）特殊样式 ================= */
        .view-mode .drag-handle {
            opacity: 0;
            pointer-events: none;
        }
        
        .view-mode .actions {
            opacity: 0;
            pointer-events: none;
        }

        .view-mode .icon-upload-wrapper {
            border-color: transparent; /* 去除虚线 */
            cursor: default;
        }
        
        .view-mode .icon-upload-wrapper input[type="file"] {
            display: none; /* 禁用上传 */
        }

        /* 禁用状态下的输入框看起来像普通文本 */
        .view-mode input[type="text"]:disabled, 
        .view-mode select:disabled {
            background-color: transparent;
            border-color: transparent;
            color: #333;
            -webkit-text-fill-color: #333; /* 解决 iOS/Safari 字体变灰问题 */
            opacity: 1;
            padding-left: 0; /* 对齐左边缘 */
            cursor: default;
            appearance: none;
            -webkit-appearance: none; /* 隐藏 select 的下拉箭头 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>底部菜单配置 <span id="count-display" style="font-size:14px; color:#7f8c8d; font-weight:normal;"></span></h2>
        
        <div class="btn-group">
            <!-- 浏览状态显示的按钮 -->
            <button class="btn btn-primary" id="edit-mode-btn" onclick="enterEditMode()">
                <i class="fa-solid fa-pen-to-square"></i> 编辑
            </button>
            
            <!-- 编辑状态显示的按钮 (默认隐藏) -->
            <button class="btn btn-default" id="cancel-btn" onclick="cancelEdit()" style="display:none;">取消</button>
            <button class="btn btn-primary" id="save-btn" onclick="saveEdit()" style="display:none;">保存</button>
            <button class="btn btn-success" id="add-btn" onclick="addMenu()" style="display:none;">
                <i class="fa-solid fa-plus"></i> 新增菜单
            </button>
        </div>
    </div>

    <!-- 添加 view-mode 类来控制全局只读样式 -->
    <ul class="menu-list view-mode" id="menu-list">
        <!-- JS 动态渲染列表 -->
    </ul>
</div>

<script>
    // 页面状态：false = 浏览模式(默认) , true = 编辑模式
    let isEditMode = false;
    
    // 用于“取消”时回滚的数据备份
    let menuDataBackup = []; 

    // 支持的展示页选项
    const pageOptions = [
        "视频", "短视频", "聊天室", "活动", "游戏中心", 
        "充值中心", "我的", "体育", "站内信", "私聊"
    ];

    // 初始/默认数据
    let menuData = [
        { id: generateId(), name: '视频', page: '视频', icon: '', protected: false },
        { id: generateId(), name: '抖音', page: '短视频', icon: '', protected: false },
        { id: generateId(), name: '聊天', page: '聊天室', icon: '', protected: true },
        { id: generateId(), name: '活动', page: '活动', icon: '', protected: false },
        { id: generateId(), name: '游戏', page: '游戏中心', icon: '', protected: true },
        { id: generateId(), name: '我的', page: '我的', icon: '', protected: true }
    ];

    const listElement = document.getElementById('menu-list');
    const addBtn = document.getElementById('add-btn');
    const countDisplay = document.getElementById('count-display');

    // 初始化拖拽 (默认禁用，进入编辑模式后开启)
    let sortable = new Sortable(listElement, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        disabled: true, // 初始禁止拖拽
        onEnd: function (evt) {
            // 同步数组数据顺序
            const movedItem = menuData.splice(evt.oldIndex, 1)[0];
            menuData.splice(evt.newIndex, 0, movedItem);
        }
    });

    // 生成随机ID
    function generateId() {
        return Math.random().toString(36).substr(2, 9);
    }

    // 渲染下拉框HTML
    function getPageOptionsHtml(selectedPage) {
        return pageOptions.map(page => {
            const isSelected = page === selectedPage ? 'selected' : '';
            return `<option value="${page}" ${isSelected}>${page}</option>`;
        }).join('');
    }

    // ================= 核心操作事件 =================

    // 1. 进入编辑模式
    window.enterEditMode = function() {
        isEditMode = true;
        // 深拷贝备份当前数据，用于取消时还原
        menuDataBackup = JSON.parse(JSON.stringify(menuData));
        
        // 开启拖拽
        sortable.option("disabled", false);
        
        renderList(); // 重新渲染（解除表单禁用状态）
    };

    // 2. 取消编辑
    window.cancelEdit = function() {
        isEditMode = false;
        // 将数据恢复为备份的数据
        menuData = JSON.parse(JSON.stringify(menuDataBackup));
        
        // 关闭拖拽
        sortable.option("disabled", true);
        
        renderList();
    };

    // 3. 保存编辑
    window.saveEdit = function() {
        // 这里可以加入提交到后端的 API 逻辑
        isEditMode = false;
        sortable.option("disabled", true);
        
        alert("配置保存成功！");
        renderList();
    };


    // ================= 渲染与数据更新 =================

    // 渲染列表与控制按钮状态
    function renderList() {
        // 1. 控制外层容器样式 (切换 view-mode 类)
        if (isEditMode) {
            listElement.classList.remove('view-mode');
        } else {
            listElement.classList.add('view-mode');
        }

        // 2. 控制头部按钮显隐
        document.getElementById('edit-mode-btn').style.display = isEditMode ? 'none' : 'flex';
        document.getElementById('cancel-btn').style.display = isEditMode ? 'block' : 'none';
        document.getElementById('save-btn').style.display = isEditMode ? 'block' : 'none';
        document.getElementById('add-btn').style.display = isEditMode ? 'flex' : 'none';

        listElement.innerHTML = '';
        
        menuData.forEach((item) => {
            const li = document.createElement('li');
            li.className = 'menu-item';
            li.dataset.id = item.id;

            // 图标回显逻辑
            const imgDisplay = item.icon ? 'style="display:block;"' : '';
            const placeholderDisplay = item.icon ? 'style="display:none;"' : '';
            
            // 是否禁用表单元素
            const disableAttr = isEditMode ? '' : 'disabled';

            li.innerHTML = `
                <i class="fa-solid fa-bars drag-handle" title="拖动排序"></i>
                
                <div class="icon-upload-wrapper" title="${isEditMode ? '点击上传图标 (40x40px)' : ''}">
                    <div class="placeholder" ${placeholderDisplay}>上传<br>图标</div>
                    <img src="${item.icon}" ${imgDisplay} id="img-${item.id}">
                    <input type="file" accept="image/png, image/jpeg, image/gif, image/webp" 
                           onchange="handleImageUpload(event, '${item.id}')" ${disableAttr}>
                </div>

                <div class="form-group">
                    <div class="field">
                        <label>菜单名称 (最多5字符)</label>
                        <input type="text" maxlength="5" value="${item.name}" 
                               placeholder="输入名称" ${disableAttr}
                               onchange="updateData('${item.id}', 'name', this.value)">
                    </div>
                    
                    <div class="field">
                        <label>关联展示页</label>
                        <select onchange="updateData('${item.id}', 'page', this.value)" ${disableAttr}>
                            ${getPageOptionsHtml(item.page)}
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button class="delete-btn" 
                            onclick="deleteMenu('${item.id}')" 
                            ${(item.protected || !isEditMode) ? 'disabled' : ''} 
                            title="${item.protected ? '基础模块不可删除' : '删除菜单'}">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
            listElement.appendChild(li);
        });

        updateUIStatus();
    }

    // 更新角标及新增按钮状态
    function updateUIStatus() {
        const currentCount = menuData.length;
        countDisplay.textContent = `( ${currentCount} / 6 )`;
        // 如果处于编辑模式且达到6个，则禁用新增按钮
        if(isEditMode) {
            addBtn.disabled = currentCount >= 6;
        }
    }

    // 更新局部数据
    window.updateData = function(id, key, value) {
        if(!isEditMode) return;
        const item = menuData.find(m => m.id === id);
        if (item) {
            item[key] = value;
        }
    };

    // 处理图片上传
    window.handleImageUpload = function(event, id) {
        if(!isEditMode) return;
        
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
            alert('上传失败：图片大小不能超过 5MB');
            event.target.value = ''; 
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;
            updateData(id, 'icon', base64Data);
            
            const wrapper = event.target.parentElement;
            const img = wrapper.querySelector('img');
            const placeholder = wrapper.querySelector('.placeholder');
            img.src = base64Data;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    };

    // 新增菜单
    window.addMenu = function() {
        if(!isEditMode) return;
        if (menuData.length >= 6) {
            alert('至多只能配置6个菜单页面！');
            return;
        }
        menuData.push({
            id: generateId(),
            name: '新菜单',
            page: '视频',
            icon: '',
            protected: false
        });
        renderList();
    };

    // 删除菜单
    window.deleteMenu = function(id) {
        if(!isEditMode) return;
        const itemIndex = menuData.findIndex(m => m.id === id);
        if (itemIndex === -1) return;
        
        if (menuData[itemIndex].protected) {
            alert('核心模块不可删除！');
            return;
        }

        if (confirm(`确定要删除【${menuData[itemIndex].name}】菜单吗？`)) {
            menuData.splice(itemIndex, 1);
            renderList();
        }
    };

    // 初始化渲染（默认进入浏览模式）
    renderList();
</script>

</body>
</html>
