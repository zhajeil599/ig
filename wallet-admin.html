<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波币钱包 · 总后台交互原型 V1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2329;background:#f0f2f5;overflow:hidden}
a{color:#1677ff;cursor:pointer;text-decoration:none}
#app{display:flex;height:100vh}
#side{width:208px;background:#001529;color:#c7cdd6;overflow-y:auto;flex-shrink:0}
#side .logo{height:56px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:600;background:#002140;letter-spacing:1px}
#side .logo small{font-size:11px;color:#8aa0b8;margin-left:6px;font-weight:400}
.mg{border-bottom:1px solid #0b2540}
.mg-t{padding:11px 18px;cursor:pointer;display:flex;justify-content:space-between;font-size:13.5px;color:#e6ebf1}
.mg-t:hover{color:#fff}
.mg-t .ar{transition:.2s;font-size:10px;opacity:.6}
.mg.open .mg-t .ar{transform:rotate(90deg)}
.mg-c{display:none;background:#000c17}
.mg.open .mg-c{display:block}
.mi{padding:8px 18px 8px 34px;cursor:pointer;font-size:13px}
.mi:hover{color:#fff}
.mi.on{background:#1677ff;color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:56px;background:#fff;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e8e8e8;gap:16px;flex-shrink:0}
#crumb{color:#8a8f99;flex:1}
#crumb b{color:#1f2329;font-weight:600}
.tg{border:1px solid #d9d9d9;border-radius:4px;padding:4px 10px;cursor:pointer;background:#fff;font-size:12px}
.tg.on{background:#fffbe6;border-color:#faad14;color:#ad6800}
#tabs{display:flex;gap:4px;padding:6px 16px 0;background:#fff;border-bottom:1px solid #e8e8e8;overflow-x:auto;flex-shrink:0}
.tb{padding:5px 12px;border:1px solid #e8e8e8;border-bottom:none;border-radius:4px 4px 0 0;background:#fafafa;cursor:pointer;white-space:nowrap;font-size:12px}
.tb.on{background:#fff;color:#1677ff;border-color:#1677ff}
.tb i{margin-left:6px;font-style:normal;color:#999}
#body{flex:1;display:flex;min-height:0}
#proto{flex:1;overflow:auto;padding:16px;min-width:0}
#notes{width:380px;flex-shrink:0;background:#fffdf5;border-left:3px solid #faad14;overflow-y:auto;padding:16px 18px}
#notes.hide{display:none}
#notes h3{font-size:15px;margin-bottom:8px;color:#ad6800;display:flex;align-items:center;gap:6px}
#notes h3:before{content:"";width:4px;height:15px;background:#faad14;border-radius:2px}
#notes h4{font-size:13px;margin:14px 0 6px;color:#1f2329;border-bottom:1px dashed #f0d58a;padding-bottom:4px}
#notes ol,#notes ul{padding-left:18px}
#notes li{margin:4px 0;color:#3d3d3d;font-size:12.5px}
#notes li b{color:#c41d7f;font-weight:600}
#notes .tag{display:inline-block;background:#fff1b8;color:#ad6800;border-radius:3px;padding:0 5px;font-size:11px;margin-right:4px}
.card{background:#fff;border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-h{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-h small{font-weight:400;color:#8a8f99;font-size:12px}
.flt{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.fi{display:flex;align-items:center;gap:6px}
.fi>label{color:#555;white-space:nowrap}
input.ip,select.ip,textarea.ip{border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;font-size:12.5px;height:28px;background:#fff;outline:none;font-family:inherit}
textarea.ip{height:64px;width:100%;resize:vertical}
input.ip:focus,select.ip:focus,textarea.ip:focus{border-color:#1677ff}
input.ip{width:150px}
.dr{display:flex;align-items:center;gap:4px}
.dr input{width:118px}
.btns{display:flex;gap:8px;margin-top:12px}
.bt{border:1px solid #d9d9d9;background:#fff;border-radius:4px;padding:4px 14px;cursor:pointer;font-size:12.5px;height:28px;white-space:nowrap}
.bt:hover{border-color:#1677ff;color:#1677ff}
.bt.p{background:#1677ff;border-color:#1677ff;color:#fff}
.bt.p:hover{background:#4096ff;color:#fff}
.bt.d{color:#ff4d4f;border-color:#ffccc7}
.bt.g{background:#52c41a;border-color:#52c41a;color:#fff}
.bt.sm{height:24px;padding:0 10px;font-size:12px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:100%;font-size:12.5px}
table.t th{background:#fafafa;font-weight:600;color:#333;white-space:nowrap}
table.t th,table.t td{border:1px solid #f0f0f0;padding:8px 10px;text-align:center;white-space:nowrap}
table.t tr:hover td{background:#f5faff}
table.t td.l{text-align:left}
table.t td .lk{margin:0 4px}
.lk.r{color:#ff4d4f}
.lk.g{color:#52c41a}
.pg{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;color:#666;font-size:12px}
.pg span.n{border:1px solid #d9d9d9;padding:0 8px;border-radius:3px}
.pg span.n.on{border-color:#1677ff;color:#1677ff}
.st{display:inline-block;padding:0 8px;border-radius:10px;font-size:11.5px;line-height:20px}
.s-g{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f}
.s-r{background:#fff1f0;color:#cf1322;border:1px solid #ffa39e}
.s-o{background:#fff7e6;color:#d46b08;border:1px solid #ffd591}
.s-b{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
.s-x{background:#f5f5f5;color:#8c8c8c;border:1px solid #d9d9d9}
.s-p{background:#f9f0ff;color:#531dab;border:1px solid #d3adf7}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.k{background:#fff;border-radius:6px;padding:14px;border:1px solid #f0f0f0}
.k .l{color:#8a8f99;font-size:12px}
.k .v{font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.k .s{font-size:11.5px;color:#8a8f99;margin-top:2px}
.k.hl{border-color:#91caff;background:#f5faff}
.sub{display:flex;gap:0;border-bottom:1px solid #e8e8e8;margin-bottom:14px}
.sub a{padding:8px 16px;color:#555;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub a.on{color:#1677ff;border-color:#1677ff;font-weight:600}
.frm{display:grid;grid-template-columns:150px 1fr;gap:12px 12px;align-items:center}
.frm>label{text-align:right;color:#555}
.frm>label.req:before{content:"* ";color:#ff4d4f}
.frm .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frm .full{grid-column:1/3}
.tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#bfbfbf;color:#fff;font-size:10px;margin-left:3px;cursor:help;position:relative;font-weight:600;vertical-align:middle}
.tip:hover{background:#1677ff}
.tip:hover:after{content:attr(data-t);position:absolute;left:18px;top:-4px;background:#262626;color:#fff;padding:6px 10px;border-radius:4px;width:max-content;max-width:280px;white-space:normal;font-weight:400;font-size:12px;line-height:1.5;z-index:99;text-align:left}
.sw{display:inline-block;width:36px;height:20px;border-radius:10px;background:#bfbfbf;position:relative;cursor:pointer;vertical-align:middle;transition:.2s}
.sw:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on{background:#1677ff}
.sw.on:after{left:18px}
.rd{display:inline-flex;gap:14px}
.rd label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.sec{font-weight:600;font-size:13px;margin:16px 0 10px;padding-left:8px;border-left:3px solid #1677ff}
.sec:first-child{margin-top:0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:6vh;overflow:auto}
.mdl{background:#fff;border-radius:8px;width:560px;max-width:94vw;margin-bottom:40px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.mdl-h{padding:14px 20px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:15px;display:flex;justify-content:space-between}
.mdl-h a{color:#999;font-weight:400}
.mdl-b{padding:18px 20px;max-height:72vh;overflow:auto}
.mdl-f{padding:10px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
.kv.c3{grid-template-columns:repeat(3,1fr)}
.kv div{display:flex;gap:6px}
.kv div span:first-child{color:#8a8f99;white-space:nowrap}
.kv div span:last-child{word-break:break-all}
.img{width:120px;height:76px;background:repeating-linear-gradient(45deg,#f5f5f5,#f5f5f5 6px,#ececec 6px,#ececec 12px);border:1px solid #e8e8e8;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.chat{background:#f7f8fa;border-radius:6px;padding:10px;max-height:220px;overflow:auto}
.chat p{margin:4px 0;font-size:12px}
.chat p em{color:#999;font-style:normal;margin-right:6px}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:8px 18px;border-radius:6px;display:none;z-index:99;font-size:13px}
.warn{background:#fff7e6;border:1px solid #ffd591;color:#ad4e00;padding:8px 12px;border-radius:4px;font-size:12px;margin-bottom:12px}
.info{background:#e6f4ff;border:1px solid #91caff;color:#0958d9;padding:8px 12px;border-radius:4px;font-size:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.node{display:flex;gap:0;align-items:center;margin:8px 0 4px;flex-wrap:wrap}
.node .nd{border:1px solid #91caff;background:#f5faff;border-radius:6px;padding:8px 10px;min-width:140px;font-size:12px}
.node .ln{width:24px;height:2px;background:#91caff}
.bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#1677ff}
.ph{height:160px;border:1px dashed #d9d9d9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#999}
.flowv{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.flowv div{flex:1;background:#91caff;border-radius:3px 3px 0 0;position:relative}
.flowv div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:#888}
.muted{color:#8a8f99}
.red{color:#ff4d4f}.green{color:#389e0d}.blue{color:#1677ff}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:12px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
 <aside id="side"><div class="logo">波币钱包<small>总后台 V1.0</small></div><div id="menu"></div></aside>
 <div id="main">
  <div id="top"><div id="crumb"></div><span class="tg on" id="ntg" onclick="toggleNotes()">需求说明：显示</span><span class="muted">admin ▾</span></div>
  <div id="tabs"></div>
  <div id="body"><section id="proto"></section><section id="notes"></section></div>
 </div>
</div>
<div id="mroot"></div><div id="toast"></div>
<script>
/* ========== 基础组件 ========== */
const $=s=>document.querySelector(s);
const S={tab:{},open:[],cur:null,flags:{}};
function esc(s){return String(s)}
function tip(t){return `<span class="tip" data-t="${t}">?</span>`}
function lbl(l){ // "名称?提示"
  if(l.includes('?')){const [a,b]=l.split('?');return a+tip(b)}return l}
function inp(ph='请输入',v='',w){return `<input class="ip" placeholder="${ph}" value="${v}" ${w?`style="width:${w}px"`:''}>`}
function sel(o,v,w){return `<select class="ip" ${w?`style="width:${w}px"`:''}>${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}
function ta(ph='请输入',v=''){return `<textarea class="ip" placeholder="${ph}">${v}</textarea>`}
function sw(on){return `<span class="sw ${on?'on':''}" onclick="this.classList.toggle('on');toast(this.classList.contains('on')?'已开启':'已关闭')"></span>`}
let _rn=0;function rad(o,c=0){_rn++;return `<span class="rd">${o.map((x,i)=>`<label><input type="radio" name="r${_rn}" ${i===c?'checked':''}>${x}</label>`).join('')}</span>`}
function chk(o,c=[]){return o.map((x,i)=>`<label class="chk"><input type="checkbox" ${c===true||c.includes(i)?'checked':''}>${x}</label>`).join('')}
function dr(){return `<span class="dr"><input class="ip" placeholder="开始日期"> 至 <input class="ip" placeholder="结束日期"></span>`}
function st(t,c){const m={g:'s-g',r:'s-r',o:'s-o',b:'s-b',x:'s-x',p:'s-p'};return `<span class="st ${m[c]||'s-x'}">${t}</span>`}
function lk(t,fn,c=''){return `<a class="lk ${c}" onclick="${fn}">${t}</a>`}
function bt(t,fn='',c=''){return `<button class="bt ${c}" onclick="${fn}">${t}</button>`}
function card(h,b,extra=''){return `<div class="card">${h?`<div class="card-h"><span>${h}</span>${extra}</div>`:''}${b}</div>`}
/* 筛选栏: [类型,标签,参数] */
function F(items,extraBtns=''){
  const h=items.map(it=>{
    const [t,l,a]=it;
    if(t==='i')return `<div class="fi"><label>${lbl(l)}</label>${inp()}</div>`;
    if(t==='s')return `<div class="fi"><label>${lbl(l)}</label>${sel(a)}</div>`;
    if(t==='d')return `<div class="fi">${Array.isArray(l)?sel(l):`<label>${l}</label>`}${dr()}</div>`;
    if(t==='r')return `<div class="fi"><label>${l}</label><span class="dr">${inp('最小',"",70)} - ${inp('最大',"",70)}</span></div>`;
    return '';
  }).join('');
  return `<div class="card"><div class="flt">${h}</div><div class="btns">${bt('查询',"toast('查询（原型演示）')",'p')}${bt('重置',"toast('已重置')")}${bt('导出',"toast('导出任务已创建，完成后在下载中心获取')")}${bt('刷新',"toast('已刷新')")}${extraBtns}</div></div>`;
}
/* 表格: cols 支持 "名称?提示" */
function T(cols,rows,opt={}){
  const th=cols.map(c=>`<th>${lbl(c)}</th>`).join('');
  const tr=rows.map(r=>`<tr>${r.map(c=>`<td>${c===undefined||c===null?'-':c}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>${opt.nopg?'':PG()}`;
}
function PG(){return `<div class="pg">共 999 条 <span class="n on">1</span><span class="n">2</span><span class="n">3</span> … <span class="n">20</span> ${sel(['50条/页','100条/页','200条/页','500条/页','1000条/页','2000条/页'],'50条/页',100)} 跳至 ${inp('',1,40)} 页</div>`}
function frm(rows){ // [label, control, req]
  return `<div class="frm">${rows.map(r=>r[0]==='--'?`<div class="full sec">${r[1]}</div>`:`<label class="${r[2]?'req':''}">${lbl(r[0])}</label><div class="row">${r[1]}</div>`).join('')}</div>`;
}
function kv(pairs,c3){return `<div class="kv ${c3?'c3':''}">${pairs.map(p=>`<div><span>${p[0]}：</span><span>${p[1]}</span></div>`).join('')}</div>`}
function kpi(list){return `<div class="kp">${list.map(k=>`<div class="k ${k[3]?'hl':''}"><div class="l">${lbl(k[0])}</div><div class="v">${k[1]}</div><div class="s">${k[2]||''}</div></div>`).join('')}</div>`}
function subTabs(key,names){
  const cur=S.tab[key]||0;
  return `<div class="sub">${names.map((n,i)=>`<a class="${i===cur?'on':''}" onclick="S.tab['${key}']=${i};render()">${n}</a>`).join('')}</div>`;
}
const GA=['谷歌验证码?涉及资金、审核、密钥类操作均需输入当前操作员的谷歌验证码',inp('请输入6位谷歌验证码'),1];
/* 弹窗 */
let _mid=0;
function M(title,body,o={}){
  _mid++;const id='m'+_mid;
  const foot=o.foot!==undefined?o.foot:`${bt('取消',`closeM('${id}')`)}${bt(o.ok||'确认',`closeM('${id}');${o.fn||`toast('${o.msg||'操作成功（原型演示）'}')`}`,'p')}`;
  const d=document.createElement('div');d.className='mask';d.id=id;
  d.innerHTML=`<div class="mdl" style="width:${o.w||560}px"><div class="mdl-h"><span>${title}</span><a onclick="closeM('${id}')">✕</a></div><div class="mdl-b">${body}</div>${foot?`<div class="mdl-f">${foot}</div>`:''}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeM(id)});
  $('#mroot').appendChild(d);
}
function closeM(id){const e=document.getElementById(id);e&&e.remove()}
function CF(msg,fn,title='提示'){M(title,`<div style="padding:8px 0">${msg}</div>`,{w:420,fn:fn||`toast('操作成功（原型演示）')`})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1800)}
function toggleNotes(){const n=$('#notes');n.classList.toggle('hide');$('#ntg').textContent='需求说明：'+(n.classList.contains('hide')?'隐藏':'显示');$('#ntg').classList.toggle('on')}
/* 双人复核提交提示 */
function DUAL(what){toast(`${what}已提交，进入【系统管理-双人复核】待复核，复核通过后生效`)}

/* ========== 页面注册 ========== */
const P={};
const MENU=[];
function G(name,items){MENU.push({name,items})}
</script>
<script>
/* ================= 仪表盘 ================= */
P.dash={t:'仪表盘',r:()=>{
 return card('',`<div class="flt"><div class="fi">${sel(['今日','昨日','近7日','近30日','自定义'])}${dr()}</div><div class="fi"><label>公司</label>${sel(['全部','白宫','少林寺'])}</div><div class="fi"><label>商户</label>${sel(['全部','商户A','商户B'])}</div>${bt('查询',"toast('查询（原型演示）')",'p')}${bt('重置')}<span class="muted">数据每1分钟更新</span></div>`)+
 card('C2C 交易概览',kpi([['C2C成交金额','3,286,400','笔数 8,214 / 人数 3,102',1],['大厅自选成交','1,926,100','占比 58.6%'],['快速买币成交','1,360,300','占比 41.4%'],['平均匹配时长?快速买币：从提交到创建成交订单的时间','2分36秒','大厅自选：即时'],['矿工兜底率?矿工完成的买币金额 ÷ 全部买币金额','12.4%','按笔数 10.8%',1],['订单成功率','96.2%','取消率 3.8%'],['申诉中订单','23','待处理 18 / 锁单中 5'],['在线矿工 / 可售矿工币','46 / 812,300','并发占用 63/138']]))+
 card('资产与资金',kpi([['用户可销售币总额','8,610,220',''],['用户不可销售币总额','2,105,300','C2C 买入后待进入游戏'],['交易中待确认币','326,900',''],['矿工币总额','812,300',''],['USDT 买币（用户）','1,028,000','折合 USDT 155,051'],['矿工 USDT 购币','520,000','折合 USDT 78,078'],['闪兑出款 USDT','42,600','笔数 316'],['内部转账','186,400','笔数 522']]))+

/* ================= 渲染 ================= */
function buildMenu(){
 $('#menu').innerHTML=MENU.map((g,gi)=>`<div class="mg ${S.open.includes(gi)?'open':''}" id="mg${gi}"><div class="mg-t" onclick="tgGroup(${gi})"><span>${g.name}</span><span class="ar">▶</span></div><div class="mg-c">${g.items.map(it=>`<div class="mi ${S.cur===it[0]?'on':''}" onclick="go('${it[0]}')">${it[1]}</div>`).join('')}</div></div>`).join('');
}
function tgGroup(i){const k=S.open.indexOf(i);k>=0?S.open.splice(k,1):S.open.push(i);buildMenu()}
const TABS=[];
function go(k){S.cur=k;if(!TABS.includes(k))TABS.push(k);if(TABS.length>8)TABS.shift();
 const gi=MENU.findIndex(g=>g.items.some(i=>i[0]===k));if(!S.open.includes(gi))S.open.push(gi);
 location.hash=k;buildMenu();render();}
function closeTab(e,k){e.stopPropagation();const i=TABS.indexOf(k);TABS.splice(i,1);if(S.cur===k)go(TABS[TABS.length-1]||'dash');else render()}
function render(){
 const p=P[S.cur];const g=MENU.find(g=>g.items.some(i=>i[0]===S.cur));
 $('#crumb').innerHTML=`${g?g.name+' / ':''}<b>${p.t}</b>`;
 $('#tabs').innerHTML=TABS.map(k=>`<span class="tb ${k===S.cur?'on':''}" onclick="go('${k}')">${P[k].t}<i onclick="closeTab(event,'${k}')">✕</i></span>`).join('');
 $('#proto').innerHTML=p.r();
 $('#notes').innerHTML=`<h3>需求说明 · ${p.t}</h3>`+p.n.map(s=>`<h4>${s[0]}</h4><ol>${s[1].map(x=>`<li>${x}</li>`).join('')}</ol>`).join('');
 $('#proto').scrollTop=0;
}
S.open=[0];
go(P[location.hash.slice(1)]?location.hash.slice(1):'dash');
</script>
