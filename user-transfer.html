let cfgDraft=null;
function cfgDlg(id){
 const c=id?CONFIG.find(x=>x.id===id):null;
 cfgDraft=c?{...c,edit:true,found:true}:{id:'',on:true,min:'',max:'',mul:'',found:false,err:{}};
 cfgDraft.err={};drawCfg();
}
function drawCfg(){
 const d=cfgDraft,e=d.err;
 modal(`<div class="dlg"><div class="hd">${d.edit?'编辑':'新增'}会员配置<span style="cursor:pointer" onclick="closeModal()">✕</span></div><div class="bd">
 <div class="fr"><span class="lb">会员ID <span class="req">*</span></span><div style="display:flex;gap:8px"><input class="ipt ${e.id?'err':''}" style="flex:1" id="cid" value="${d.id}" ${d.edit?'disabled':''} placeholder="输入会员ID"><button class="btn" ${d.edit?'disabled':''} onclick="cfgSearch()">搜索</button></div>
 ${e.id?`<div class="errtxt">${e.id}</div>`:''}${d.found&&MEMBERS[d.id]?`<div style="margin-top:6px;color:#67c23a">会员昵称：${MEMBERS[d.id].n}</div>`:''}</div>
 <div class="fr"><span class="lb">划转功能开关</span><span class="sw ${d.on?'on':''}" onclick="cfgDraft.on=!cfgDraft.on;sync();drawCfg()"><i></i>${d.on?'开启':'关闭'}</span></div>
 <div class="fr"><span class="lb">单次转账限额区间 <span class="req">*</span></span><div style="display:flex;gap:8px;align-items:center"><input class="ipt ${e.r?'err':''}" style="flex:1" id="cmin" value="${d.min}" placeholder="¥ 下限"> - <input class="ipt ${e.r?'err':''}" style="flex:1" id="cmax" value="${d.max}" placeholder="¥ 上限"></div>${e.r?`<div class="errtxt">${e.r}</div>`:''}</div>
 <div class="fr"><span class="lb">转账收款稽核倍数 <span class="req">*</span>${q('收款方到账后，需完成「到账金额 × 倍数」\n的打码量才可提现；填 0 表示不增加打码量')}</span><div style="display:flex;align-items:center;gap:6px"><input class="ipt ${e.m?'err':''}" style="flex:1" id="cmul" value="${d.mul}"> 倍</div>${e.m?`<div class="errtxt">${e.m}</div>`:''}</div>
 </div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="cfgSave()">保存</button></div></div>`);
}
function sync(){if(!window.cid)return;if(!cfgDraft.edit)cfgDraft.id=cid.value.trim();cfgDraft.min=cmin.value.trim();cfgDraft.max=cmax.value.trim();cfgDraft.mul=cmul.value.trim()}
function cfgSearch(){sync();const d=cfgDraft;d.err={};d.found=false;
 if(!MEMBERS[d.id])d.err.id='会员ID不存在';else if(CONFIG.some(c=>c.id===d.id))d.err.id='该会员已存在配置，请直接编辑';else d.found=true;drawCfg()}
function cfgSave(){sync();const d=cfgDraft;d.err={};
 if(!d.edit){if(!d.id)d.err.id='请输入会员ID';else if(!MEMBERS[d.id])d.err.id='会员ID不存在';else if(CONFIG.some(c=>c.id===d.id))d.err.id='该会员已存在配置，请直接编辑';}
 const mn=Number(d.min),mx=Number(d.max),mu=Number(d.mul);
 if(d.min===''||d.max===''||isNaN(mn)||isNaN(mx)||mn<0||mx<=0)d.err.r='请输入正确的限额（下限≥0，上限>0）';else if(mn>mx)d.err.r='下限不能大于上限';
 if(d.mul===''||isNaN(mu)||mu<0)d.err.m='请输入≥0的倍数';
 if(Object.keys(d.err).length)return drawCfg();
 const row={id:d.id,on:d.on,min:mn,max:mx,mul:mu};
 if(d.edit)CONFIG=CONFIG.map(c=>c.id===d.id?row:c);else CONFIG.unshift(row);
 closeModal();render();flash('保存成功');
}

 <div class="m-ipt ${e.id?'err':''}"><input id="tid" placeholder="请输入用户ID" value="${t.id}" inputmode="numeric" onblur="lookup(this.value)" oninput="S.tf.id=this.value"><span class="ic" title="通讯录好友" onclick="S.friendSel=S.tf.payee;go('c-friend')">👤</span></div>
 ${e.id?`<div class="m-err">${e.id}</div>`:''}
 ${t.payee?`<div class="payee"><div class="av">头像</div><div><div class="nm">${MEMBERS[t.payee].n}</div><div class="id">ID：${t.payee}</div></div>${isFriend(t.payee)?'':`<button class="sbtn" onclick="go('c-addfriend',{addTarget:S.tf.payee})">添加好友</button>`}</div>`:''}
 <div class="m-lb">划转金额</div>
 <div class="m-ipt ${e.amt?'err':''}"><input id="tamt" placeholder="限额${c.min}-${c.max}" value="${t.amt}" inputmode="decimal" oninput="S.tf.amt=this.value.replace(/[^\\d.]/g,'');this.value=S.tf.amt;btnState()"></div>
 ${e.amt?`<div class="m-err">${e.amt}</div>`:''}
 <div class="m-sub">可用余额：${fmt(S.balance)}</div>
 <div class="m-lb">支付密码<small onclick="go('c-forgot')">忘记密码？</small></div>
 <div class="m-ipt ${e.pwd?'err':''}"><input id="tpwd" type="${t.showPwd?'text':'password'}" placeholder="请输入支付密码" value="${t.pwd}" maxlength="6" oninput="S.tf.pwd=this.value;btnState()"><span style="cursor:pointer;color:#888" onclick="S.tf.showPwd=!S.tf.showPwd;render()">${t.showPwd?'◉':'◎'}</span></div>
 ${e.pwd?`<div class="m-err">${e.pwd}</div>`:''}
 <button class="m-btn" id="tbtn" ${tfValid()?'':'disabled'} onclick="submitTf()">确认划转</button>`,
 {right:`<span class="rt" onclick="go('c-history')">划转记录</span>`});
};
function btnState(){const b=document.getElementById('tbtn');if(b)b.disabled=!tfValid()}
function lookup(v){v=v.trim();const t=S.tf;const old=t.payee+'|'+t.err.id;t.id=v;t.err.id='';t.payee=null;
 if(v){if(!MEMBERS[v])t.err.id='用户ID不存在';else if(v===ME)t.err.id='不能划转给自己';else t.payee=v;}
 if(old!==t.payee+'|'+t.err.id)setTimeout(()=>{if(cur==='c-transfer')render()},0);}
function submitTf(){
 const t=S.tf,c=myCfg(),a=Number(t.amt);t.err={};
 if(!c||!c.on){toast('划转功能未开启');return}
 if(isNaN(a)||a<c.min||a>c.max)t.err.amt='划转金额超限';
 else if(a>S.balance)t.err.amt='可用余额不足';
 else if(t.pwd!==S.pwd)t.err.pwd='支付密码不正确';
 if(Object.keys(t.err).length)return render();
 const no='2026112111023'+String(Math.floor(Math.random()*9e7)+1e7);
 RECORDS.unshift({no,from:ME,to:t.payee,amt:a,t:now(),rm:'-'});
 S.balance=+(S.balance-a).toFixed(2);
 const to=t.payee;S.tf={id:'',payee:null,amt:'',pwd:'',showPwd:false,err:{}};
 render();
 document.querySelector('.phone').insertAdjacentHTML('beforeend',`<div class="sheet"><div class="box"><div style="font-size:36px;color:#67c23a">✓</div><h3>划转成功</h3><div class="amt">${fmt(a)}</div>
 <div style="color:#606266;font-size:13px">已转给 ${MEMBERS[to].n}（ID：${to}）</div><div class="row"><button onclick="go('c-detail',{detail:'${no}'})">查看详情</button><button class="p" onclick="render()">完成</button></div></div></div>`);
}

V['c-friend']=()=>phone('选择好友',FRIENDS.map(([L,ids])=>`<div class="letter">${L}</div>`+ids.map(id=>`<div class="fitem ${S.friendSel===id?'on':''}" onclick="S.friendSel='${id}';render()"><div class="av">头像</div><div><div>${MEMBERS[id].n}</div><div style="font-size:12px;color:#909399">ID：${id}</div></div><span class="rd"></span></div>`).join('')).join(''),
 {back:'c-transfer',foot:`<div class="ph-foot"><button class="m-btn" style="margin:0;width:100%" ${S.friendSel?'':'disabled'} onclick="S.tf.id=S.friendSel;S.tf.payee=S.friendSel;S.tf.err.id='';go('c-transfer')">确认选择</button></div>`});

function myRecs(){return RECORDS.filter(r=>r.from===ME||r.to===ME)}
V['c-history']=()=>{
 let l=myRecs();if(S.histTab==='out')l=l.filter(r=>r.from===ME);if(S.histTab==='in')l=l.filter(r=>r.to===ME);
 return phone('划转记录',`${l.length?l.map(r=>{const out=r.from===ME,o=out?r.to:r.from;return `<div class="rec" onclick="go('c-detail',{detail:'${r.no}'})"><div class="l"><b>${out?'转出给 ':'收到 '}${MEMBERS[o].n}</b><p>对方ID：${o}<br>订单号：${r.no}<br>时间：${r.t}</p></div><div class="r"><div class="st">成功</div><div class="a ${out?'minus':'plus'}">${out?'-':'+'}${fmt(r.amt)}</div></div></div>`}).join(''):'<div class="empty">暂无划转记录</div>'}`,
 {back:'c-transfer',right:'',foot:''}).replace('<div class="ph-bd" id="phbd">',`<div class="tabs">${[['all','全部'],['out','转出'],['in','转入']].map(([k,n])=>`<div class="${S.histTab===k?'on':''}" onclick="S.histTab='${k}';render()">${n}</div>`).join('')}</div><div class="timef">${['今天','昨天','近7天','近30天'].map(x=>`<span class="${S.histTime===x?'on':''}" onclick="S.histTime='${x}';render()">${x}</span>`).join('')}</div><div class="ph-bd" id="phbd">`);
};
V['c-detail']=()=>{
 const r=RECORDS.find(x=>x.no===S.detail)||myRecs()[0];const out=r.from===ME,o=out?r.to:r.from;
 const cfg=CONFIG.find(c=>c.id===r.from);
 return phone('划转详情',`<div class="det"><div style="color:#606266">${out?'划转支出':'划转收入'}</div><div class="a ${out?'minus':'plus'}">${out?'-':'+'}${fmt(r.amt)}</div><div style="color:#67c23a">成功</div></div>
 <div class="dl"><span>${out?'收款人':'转出人'}</span><span>${MEMBERS[o].n}</span></div><div class="dl"><span>对方ID</span><span>${o}</span></div>
 <div class="dl"><span>订单号</span><span>${r.no} <a onclick="toast('已复制')">复制</a></span></div><div class="dl"><span>划转时间</span><span>${r.t}</span></div>
 ${!out&&cfg&&cfg.mul>0?`<div class="dl"><span>需完成打码量</span><span>${fmt(r.amt*cfg.mul)}</span></div>`:''}`,{back:'c-history'});
};

V['c-trade']=()=>{
 const tabs=['充值','提现','消费','场馆','活动','主播','划转'];
 let body='';
 if(S.tradeTab==='划转'){body=myRecs().map(r=>{const out=r.from===ME;return `<div class="rec" onclick="go('c-detail',{detail:'${r.no}'})"><div class="l"><b>${out?'划转支出':'划转收入'}</b><p>订单号：${r.no}<br>时间：${r.t}</p></div><div class="r"><div class="st">成功</div><div class="a ${out?'minus':'plus'}">${out?'-':'+'}${fmt(r.amt)}</div></div></div>`}).join('')}
 else body=`<div class="rec"><div class="l"><b>${S.tradeTab}示例记录</b><p>订单号：20260330123546213546584<br>时间：2026-12-12 12:12:12</p></div><div class="r"><div class="st">成功</div><div class="a">123.45</div></div></div>`;
 return phone('交易记录',body,{back:'c-mine'}).replace('<div class="ph-bd" id="phbd">',`<div class="tabs">${tabs.map(t=>`<div class="${S.tradeTab===t?'on':''}" onclick="S.tradeTab='${t}';render()">${t}</div>`).join('')}</div><div class="timef">${['昨天','近7天','近15天','近30天'].map((x,i)=>`<span class="${i==1?'on':''}">${x}</span>`).join('')}</div><div class="ph-bd" id="phbd">`);
};
V['c-addfriend']=()=>{const id=S.addTarget||'100012345',m=MEMBERS[id];
 return `<div class="phone af"><div class="aftop"><span>聊天室</span><span class="on">好友消息</span></div>
 <div class="afsub"><span>消息</span><span>未读</span><span class="on">通讯录</span></div>
 <div class="ph-bd"><div class="afback" onclick="go('c-transfer')">‹　添加好友/群聊</div>
 <div class="afp"><div class="afav">头像</div><div><b>${m.n}</b><div>ID: ${id}</div><div>个性签名:</div></div></div>
 <div class="afl">请填写验证信息</div><textarea class="aft">我是${MEMBERS[ME].n}</textarea>
 <div class="afr"><span>备注名</span><span>✎</span></div>
 <div class="afsend" onclick="sendApply('${id}')">发送申请</div></div>
 <div class="botnav dkn">${['视频','抖音','聊天','活动','游戏','我的'].map(t=>`<div class="${t==='聊天'?'on':''}">${t}</div>`).join('')}</div></div>`;
};
V['c-forgot']=()=>`<div class="phone fg"><div class="ph-hd" style="background:#1a1a1a"><span class="bk" onclick="go('c-transfer')">‹</span><b>重置支付密码</b></div><div class="ph-bd">
 <div class="fl">新密码</div><div class="fi"><input type="password" maxlength="6" placeholder="请输入6位数字组合的新密码"><span>◡</span></div>
 <div class="fl">确认密码</div><div class="fi"><input type="password" maxlength="6" placeholder="请输入确认密码"><span>◡</span></div>
 <div class="fl">手机号</div><div style="display:flex;gap:10px;margin:0 14px"><div class="fi" style="margin:0;width:56px;justify-content:center">+86</div><div class="fi" style="margin:0;flex:1">138****1551</div></div>
 <div class="fl">验证码</div><div class="fi"><input placeholder="请输入验证码"><span style="color:#ff3b30;cursor:pointer" onclick="toast('验证码已发送')">发送验证码</span></div>
 <button class="fgbtn" onclick="toast('支付密码已重置')">提交</button></div></div>`;

/* ============ 需求说明 ============ */
const NOTE={
log:`<h3>需求背景</h3>会员之间可互相划转余额。仅后台配置过且开启划转功能的会员可发起划转，划转即时到账；收款方按转出方配置的稽核倍数增加打码量，用于提现稽核。
<h4>原型说明</h4>左侧点击切换页面。原型内数据联动：在客户端发起划转后，后台划转记录、资金明细、会员详情统计同步更新。`,
'a-member':`<h3>会员列表</h3><ol><li>金流-充值：展示为「充值金额 + 划转金额(划转)」，划转金额为该会员收到的划转（转入）累计金额；小计行同样统计。</li><li>会员详情-概况：增加「划转」行，展示所选时间范围内收到划转的次数/金额。</li><li>点击划转行的「明细」跳转至划转记录，自动带入转入用户ID筛选该会员。</li></ol>`,
'a-withdraw':`<h3>提现列表</h3><ol><li>金流列与会员列表一致：充值金额后追加「+划转金额(划转)」，统计该会员收到的划转累计金额，便于审核提现时识别资金来源。</li></ol>`,
'a-record':`<h3>划转记录</h3><ol><li>菜单位置：财务管理-划转记录。</li><li>每笔划转生成一条记录，按转账时间倒序。</li><li>展示渠道商、订单号、转出用户ID、转出用户昵称、转出会员层级、转账金额、转入用户ID、转入会员昵称、转入会员层级、转账时间、备注。</li><li>渠道商：展示转出会员所属渠道。</li><li>昵称、层级展示会员当前信息。</li><li>查询条件：转账时间、订单号、转出用户ID、转入用户ID；支持导出。</li><li>备注：预留，无内容时展示「-」。</li></ol>`,
'a-config':`<h3>划转配置</h3><ol><li>菜单位置：财务管理-划转配置，独立菜单。</li><li>划转功能按会员单独配置，未添加配置或开关关闭的会员不可发起划转，客户端不展示划转按钮；接收划转不受此限制。</li><li>新增：输入会员ID后搜索，会员不存在提示「会员ID不存在」，已配置过的会员提示直接编辑，同一会员只能有一条配置。</li><li>单次转账限额区间：下限≥0，上限>0，下限不能大于上限；客户端划转金额须在此区间内。</li><li>转账收款稽核倍数：≥0；收款方到账后增加「到账金额×倍数」的打码量，打码完成后才可提现。</li><li>编辑：会员ID不可修改，其余可改，保存后即时生效。</li><li>删除：二次确认，删除后该会员不可再发起划转。</li><li>列表支持按会员ID查询。</li></ol>`,
'a-fund':`<h3>资金明细</h3><ol><li>账变类型增加「划转收入」「划转支出」，可按类型筛选。</li><li>一笔划转产生两条账变：转出方「划转支出」（减少），收款方「划转收入」（增加），两条订单号与划转记录一致。</li><li>备注展示对方用户ID。</li></ol>`,
'c-mine':`<h3>我的</h3><ol><li>余额区在「充值」和「提现」之间增加「划转」按钮，点击进入划转页。</li><li>仅后台已配置且开启划转功能的会员展示划转按钮；不展示时，余额区保持充值、提现两个按钮。</li><li>页面其余内容为现有内容，不做改动。</li></ol>`,
'c-transfer':`<h3>划转</h3><ol><li>右上角「划转记录」：点击进入划转记录页查看历史订单。</li><li>收款人：输入用户ID，输入框失去焦点后查询并展示对方头像、昵称、ID；用户不存在提示「用户ID不存在」，输入自己的ID提示「不能划转给自己」。</li><li>点击输入框右侧图标进入通讯录选择好友，确认后自动带入收款人。</li><li>添加好友：查询到的收款人还不是好友时，在收款人信息右侧展示「添加好友」按钮，已是好友则不展示。点击直接跳转添加好友页面并带入对方信息，完成添加后返回划转页，已填写的收款人、金额保留，「添加好友」按钮不再展示，对方同步出现在通讯录好友中。</li><li>划转金额：输入框提示展示该会员的单次限额区间；下方展示可用余额。超出区间提示「划转金额超限」，超过余额提示「可用余额不足」。</li><li>打码量：发起划转不受打码量限制；收款方到账后按转出方配置的稽核倍数增加打码量。</li><li>支付密码：输入错误提示「支付密码不正确」；「忘记密码？」进入现有重置支付密码页面。</li><li>收款人、金额、密码均填写后「确认划转」才可点击。</li><li>划转成功即时扣款到账，弹出成功提示，可查看详情或完成（清空表单停留本页）。</li></ol>`,
'c-friend':`<h3>选择好友</h3><ol><li>展示当前会员的通讯录好友，按昵称首字母分组。</li><li>单选，选中后「确认选择」可点击，返回划转页并带入收款人。</li></ol>`,
'c-history':`<h3>划转记录</h3><ol><li>入口：划转页右上角。</li><li>页签：全部 / 转出 / 转入；时间筛选：今天、昨天、近7天、近30天。</li><li>每条展示：转出给/收到 + 对方昵称、对方ID、订单号、时间、状态、金额（转出为 -，转入为 +）。</li><li>划转即时完成，状态均为「成功」。</li><li>按时间倒序，点击进入划转详情。</li></ol>`,
'c-detail':`<h3>划转详情</h3><ol><li>展示类型（划转支出/划转收入）、金额、状态、对方昵称、对方ID、订单号（可复制）、划转时间。</li><li>转入记录额外展示本笔需完成的打码量（到账金额 × 转出方配置的稽核倍数）；倍数为0时不展示。</li></ol>`,
'c-trade':`<h3>交易记录</h3><ol><li>增加「划转」页签，展示划转收入与划转支出，点击进入划转详情。</li><li>划转订单只在「划转」页签展示，与划转记录页数据一致。</li></ol>`,
'c-addfriend':`<h3>添加好友</h3><ol><li>现有页面，页面内容不做改动。</li><li>从划转页收款人信息的「添加好友」进入时，自动带入对方头像、昵称、ID，验证信息默认带入「我是+本人昵称」，可修改。</li><li>点击「发送申请」完成添加后，提示「添加好友成功」并返回划转页；点击左上角返回也回到划转页。</li></ol>`,
'c-forgot':`<h3>重置支付密码</h3>现有页面，不做改动。从划转页「忘记密码？」进入。`
};
function demoCtl(){
 if(cur==='c-transfer')return `<div class="demo">演示控制：<br>支付密码为 123456；收款人：已是好友 100012345 / 100020003；非好友 100041118 / 100040958 / 100041105</div>`;
 if(cur==='c-mine')return `<div class="demo">演示控制：<br><label><input type="checkbox" ${myCfg()&&myCfg().on?'checked':''} onchange="const c=myCfg();if(c)c.on=this.checked;else CONFIG.push({id:ME,on:true,min:100,max:5000,mul:1.5});render()"> 当前会员已开启划转</label></div>`;
 return '';
}

/* ============ 通用 ============ */
function render(){document.getElementById('canvas').innerHTML=V[cur]();document.getElementById('notes').innerHTML=(NOTE[cur]||'')+demoCtl()}
function modal(h){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="mask" id="mk">${h}</div>`)}
function closeModal(){const m=document.getElementById('mk');if(m)m.remove()}
function toast(m){const p=document.querySelector('.phone');if(!p)return;const d=document.createElement('div');d.className='toast';d.textContent=m;p.appendChild(d);setTimeout(()=>d.remove(),1800)}
function flash(m){const d=document.createElement('div');d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#f0f9eb;color:#67c23a;border:1px solid #e1f3d8;padding:8px 18px;border-radius:4px;z-index:99';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
renderMap();render();
</script>
</body>
</html>
