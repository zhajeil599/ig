<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG启动与游戏大厅纯代码原型</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #2c2c2e; /* 网页背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        /* 核心容器：严格限制为 375 * 375px */
        .app-container {
            width: 375px;
            height: 375px;
            position: relative;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #222;
        }

        /* 页面切换基础类 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        /* ================= 第一页：启动页 ================= */
        #page1 {
            z-index: 10;
            opacity: 1;
            background-color: #050505;
            justify-content: center;
            align-items: center;
        }

        /* 右上角倒计时 */
        .countdown {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 纯 CSS 模拟 PG 像素 Logo */
        .pg-logo-wrapper {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .letter-block {
            font-family: "Arial Black", Impact, sans-serif;
            font-size: 90px;
            color: #fff;
            line-height: 1;
            position: relative;
            letter-spacing: -2px;
        }

        /* 模拟 Logo 上的彩色像素点 */
        .pixel-dot {
            position: absolute;
            width: 6px;
            height: 6px;
        }
        /* P 的点 */
        .p-dot-1 { background: #6200ea; top: 12px; left: -2px; }
        .p-dot-2 { background: #ff6d00; top: 0px; right: -2px; }
        .p-dot-3 { background: #d500f9; bottom: 25px; right: 28px; }
        .p-dot-4 { background: #00b0ff; bottom: 6px; left: 0px; }
        /* G 的点 */
        .g-dot-1 { background: #ffab00; top: 0px; left: 10px; }
        .g-dot-2 { background: #f50057; top: 20px; left: -4px; }
        .g-dot-3 { background: #00e676; top: 38px; right: -2px; }
        .g-dot-4 { background: #d50000; bottom: 35px; right: 0px; }
        .g-dot-5 { background: #ff6d00; bottom: 2px; right: 12px; }
        .g-dot-6 { background: #2979ff; bottom: 18px; left: 8px; }

        /* 底部口号 */
        .slogan {
            color: #999;
            font-size: 13px;
            letter-spacing: 8px;
            margin-left: 8px; /* 补偿 letter-spacing 造成的居中偏移 */
        }


        /* ================= 第二页：游戏选择大厅 ================= */
        #page2 {
            z-index: 5;
            opacity: 0;
            background-color: #0b0c10; 
            padding: 15px 10px;
        }

        /* 4列3行 网格布局 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            width: 100%;
        }

        /* 单个游戏卡片 */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* 纯 CSS 游戏图标模拟 */
        .game-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            position: relative;
        }
        
        /* 内部圆环装饰 */
        .game-icon::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            border-top: 1px solid rgba(255,255,255,0.4);
        }

        /* 各个游戏的专属配色 */
        .bg-1 { background: radial-gradient(circle at top, #4caf50, #1b5e20); }
        .bg-2 { background: radial-gradient(circle at top, #ff9800, #b71c1c); }
        .bg-3 { background: radial-gradient(circle at top, #5c3a21, #1a1005); border: 1px solid #ffd54f; }
        .bg-4 { background: radial-gradient(circle at top, #f44336, #880e4f); }
        .bg-5 { background: radial-gradient(circle at top, #cddc39, #33691e); }
        .bg-6 { background: radial-gradient(circle at top, #00bcd4, #01579b); }
        .bg-7 { background: radial-gradient(circle at top, #9c27b0, #311b92); }
        .bg-8 { background: radial-gradient(circle at top, #e91e63, #4a148c); }
        .bg-9 { background: radial-gradient(circle at top, #81d4fa, #006064); }
        .bg-10 { background: radial-gradient(circle at top, #03a9f4, #1565c0); }
        .bg-11 { background: radial-gradient(circle at top, #ffeb3b, #d84315); }
        .bg-12 { background: radial-gradient(circle at top, #ff5722, #bf360c); }

        /* 游戏名称 */
        .game-name {
            color: #dcdcdc;
            font-size: 11px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: scale(0.95);
        }

        /* 底部指示器 */
        .pagination {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .dot {
            width: 20px;
            height: 4px;
            background-color: #444;
            border-radius: 2px;
        }
        .dot.active {
            background-color: #ff3366; /* 亮粉色当前页 */
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ================= 第一页：启动页 ================= -->
        <div class="page" id="page1">
            <div class="countdown" id="countdown">3s</div>
            
            <!-- 纯 CSS 拼装 PG 标志 -->
            <div class="pg-logo-wrapper">
                <div class="letter-block">
                    P
                    <div class="pixel-dot p-dot-1"></div>
                    <div class="pixel-dot p-dot-2"></div>
                    <div class="pixel-dot p-dot-3"></div>
                    <div class="pixel-dot p-dot-4"></div>
                </div>
                <div class="letter-block">
                    G
                    <div class="pixel-dot g-dot-1"></div>
                    <div class="pixel-dot g-dot-2"></div>
                    <div class="pixel-dot g-dot-3"></div>
                    <div class="pixel-dot g-dot-4"></div>
                    <div class="pixel-dot g-dot-5"></div>
                    <div class="pixel-dot g-dot-6"></div>
                </div>
            </div>
            
            <div class="slogan">不凡 成就 非凡</div>
        </div>


        <!-- ================= 第二页：游戏选择大厅 ================= -->
        <div class="page" id="page2">
            <!-- 游戏列表网格 -->
            <div class="game-grid">
                <div class="game-card">
                    <div class="game-icon bg-1">🦍</div>
                    <div class="game-name">金刚丛林之塔</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-2">🐎</div>
                    <div class="game-name">马上发发</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-3">🃏</div>
                    <div class="game-name">终极王牌</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-4">🐯</div>
                    <div class="game-name">虎运来来</div>
                </div>

                <div class="game-card">
                    <div class="game-icon bg-5">♠️</div>
                    <div class="game-name">王牌在手</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-6">🐟</div>
                    <div class="game-name">金刚捕鱼</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-7">💎</div>
                    <div class="game-name">热辣财富</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-8">🦹</div>
                    <div class="game-name">侠盗大劫案</div>
                </div>

                <div class="game-card">
                    <div class="game-icon bg-9">🏒</div>
                    <div class="game-name">冰球突破十万...</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-10">🏖️</div>
                    <div class="game-name">放浪假日</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-11">🎡</div>
                    <div class="game-name">皇家幸运轮</div>
                </div>
                <div class="game-card">
                    <div class="game-icon bg-12">🔥</div>
                    <div class="game-name">野火灼金</div>
                </div>
            </div>

            <!-- 底部分页点 -->
            <div class="pagination">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

    </div>

    <script>
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');

        // 倒计时与页面切换逻辑
        const timer = setInterval(() => {
            timeLeft--;
            
            if (timeLeft > 0) {
                countdownEl.innerText = timeLeft + 's';
            } else {
                // 清除定时器并隐藏倒计时文本
                clearInterval(timer);
                countdownEl.style.display = 'none';
                
                // 触发 CSS 淡入淡出切换
                page1.style.opacity = '0';
                page2.style.opacity = '1';
                
                // 等待 CSS 过渡动画(0.6秒)完成后，将 page1 彻底隐藏
                setTimeout(() => {
                    page1.style.display = 'none';
                }, 600);
            }
        }, 1000);
    </script>

</body>
</html>
