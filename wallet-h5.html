<body>
<div id="wrap">
 <div id="idx"><div class="lg">波币钱包 · 前端原型<small>H5 / APP V1.0 · 左侧点击页面或状态</small></div><input id="q" placeholder="搜索页面…" oninput="buildIdx()"><div id="il"></div></div>
 <div id="stage">
  <div id="phoneBox"><div id="ptitle"></div><div id="phone"><div class="sb"><span>9:41</span><span>●●● ᯤ ▮</span></div><div id="scr"></div><div id="fix"></div><div id="ov"></div><div id="ptoast"></div><div class="home-ind"></div></div></div>
  <div id="notes"></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const ST={kyc:true,merchant:false,payPwd:true,gesture:false,miner:false};
const H={};     // 页面
const IDX=[];   // 左侧索引
let CUR=null,CUR_S={},HIS=[];
function I(group,items){IDX.push({group,items})} // items: [label,key,state,isNew]
/* ---- 通用组件 ---- */
function nb(t,o={}){return `<div class="nb ${o.tr?'tr':''}">${o.noback?'':`<span class="bk" onclick="back()">‹</span>`}${t}${o.rt?`<span class="rt">${o.rt}</span>`:''}</div>`}
const KF=`<span class="ic" onclick="nav('service')" title="客服">🎧</span>`;
function cl(k,v='',o={}){return `<div class="cl ${o.fn?'ck':''}" ${o.fn?`onclick="${o.fn}"`:''}><span class="k">${k}</span><span class="v ${o.fn&&!o.noarr?'arr':''}">${v}</span></div>`}
function cd(x,st=''){return `<div class="cd" style="${st}">${x}</div>`}
function btn(t,fn='',c=''){return `<button class="btn ${c}" onclick="${fn}">${t}</button>`}
function bot(x){return `<div class="bot">${x}</div>`}
function pi(t){return t.split('').map(c=>({b:'<span class="pi b">卡</span>',a:'<span class="pi a">支</span>',w:'<span class="pi w">微</span>',e:'<span class="pi e">数</span>'}[c])).join('')}
function lv(t){const c={'极好':'g','欠佳':'r'}[t]||'';return `<span class="lv ${c}">◆${t}</span>`}
function tbar(a){const it=[['首页','⌂','home'],['交易','⇄','hall'],['订单','☰','orders'],['我的','☺','me']];return `<div class="tbar">${it.map((x,i)=>`<a class="${i===a?'on':''}" onclick="nav('${x[2]}')"><i>${x[1]}</i>${x[0]}</a>`).join('')}</div>`}
function tabs(arr,on,fn){return `<div class="tabs">${arr.map((x,i)=>`<a class="${i===on?'on':''}" onclick="${fn}(${i})">${x}</a>`).join('')}</div>`}
